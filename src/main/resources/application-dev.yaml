spring:
  datasource:
    url: ${POSTGRES_TEST_URL}
    username: ${POSTGRES_TEST_USER}
    password: ${POSTGRES_TEST_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  docker:
    compose:
      enabled: true