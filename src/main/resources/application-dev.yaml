spring:
  datasource:
    url: ${POSTGRES_TEST_URL:jdbc:postgresql://localhost:5433/smartfish}
    username: ${POSTGRES_TEST_USER:user}
    password: ${POSTGRES_TEST_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  docker:
    compose:
      enabled: true

